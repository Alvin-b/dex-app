name: Build Android APK & GitHub Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          else
            gradle assembleRelease --no-daemon || gradle assembleDebug --no-daemon
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/*/*/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0-${{ github.run_number }}
          name: DEX Logistics Release v2.5.0 (Build ${{ github.run_number }})
          body: |
            ## DEX Logistics Production Release
            - Automated GitHub Actions CI/CD Build
            - Real-time Firestore & Supabase multi-cloud sync
            - Dynamic package tracking, payment allocations & OCR scanner
            - Automatic in-app OTA software updates
          draft: false
          prerelease: false
          files: app/build/outputs/apk/*/*/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
